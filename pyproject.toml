[project]
name = "play-store-review-insights"
version = "0.2.0"
description = "Turn app store reviews into design and product insights."
authors = [{ name = "Biswarup Mondal" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Offline unit tests only: no network access or API keys needed.
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# B008: FastAPI declares dependencies as Depends()/Query() defaults by design.
ignore = ["B008"]
